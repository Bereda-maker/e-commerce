name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, migrate, and test (Pest + MySQL)
    runs-on: ubuntu-latest

    # The concurrency test (CheckoutConcurrencyTest) needs real row-level
    # locking semantics under two genuinely simultaneous transactions —
    # that's MySQL here, not an in-memory SQLite swap. See phpunit.xml
    # and the test file's own comments for why.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: ecommerce_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # pcntl is required by CheckoutConcurrencyTest to genuinely fork
          # two OS processes for the two simultaneous checkout attempts —
          # ubuntu-latest + this extension is what makes that possible.
          extensions: mbstring, pdo_mysql, pcntl, bcmath, ctype, xml
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-interaction --prefer-dist"

      - name: Generate app key
        run: php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uroot --silent && break
            sleep 2
          done

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: ecommerce_testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force

      - name: Run Pint (style check)
        run: vendor/bin/pint --test

      - name: Run Pest
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: ecommerce_testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: vendor/bin/pest
